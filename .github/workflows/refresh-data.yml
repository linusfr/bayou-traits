name: Refresh Data

# Run manually after a Hunt patch, or automatically on schedule.
# This commits an updated data.json which then triggers the deploy workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'    # every Monday at 10:00 UTC

permissions:
  actions: write
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd scraper && uv sync

      - name: Run data pipeline
        run: cd scraper && uv run python build.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data.json
          PATCH=$(jq -r '.meta.patch' frontend/src/data.json)
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh for patch ${PATCH}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not emit push workflow runs, so dispatch explicitly.
      - name: Trigger release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
